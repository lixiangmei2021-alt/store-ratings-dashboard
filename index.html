<style>
:root{--navy:#142a46;--blue:#2563eb;--ink:#17243a;--muted:#6a7890;--line:#dce5f0;--bg:#f4f7fb;--card:#fff;--warn:#a46700}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,#e7f0ff 0,transparent 34%),var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1320px;margin:auto;padding:28px 22px 60px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 32px;color:white;background:linear-gradient(125deg,#132b49,#1e4c7b 57%,#117f8b);box-shadow:0 18px 48px rgba(17,48,81,.18)}
.hero:after{content:"";position:absolute;width:360px;height:360px;right:-100px;top:-190px;border:55px solid rgba(255,255,255,.06);border-radius:50%}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a9ddf1;font-weight:700}.hero h1{font-size:34px;margin:8px 0 7px;letter-spacing:-.5px}.hero p{margin:0;color:#d5e7f5}.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.pill{display:inline-flex;gap:7px;align-items:center;padding:8px 12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);border-radius:999px;font-size:13px;backdrop-filter:blur(8px)}
.dot{width:7px;height:7px;background:#7ce3bd;border-radius:50%;box-shadow:0 0 0 4px rgba(124,227,189,.12)}.dot.warn{background:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.12)}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(29,58,94,.05)}.card .label{font-size:12px;color:var(--muted);font-weight:600}.card .value{font-size:27px;font-weight:750;margin-top:4px;color:var(--navy)}.card .sub{font-size:12px;color:var(--muted);margin-top:3px}

<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Google Play · App Store</div>
    <h1>双端商店评分看板</h1>
    <p>Frontier City 与 Vice Throne 的逐国家/地区公开评分，每 4 小时自动刷新。</p>
    <div class="meta" id="meta"></div>
  </section>

    <a class="button" id="xlsx" href="#">打开最新 Excel</a>

  <div class="cards" id="cards"></div>
  <div id="products"></div>

</div>

const nf = new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function fmtTime(s){try{return nf.format(new Date(s))}catch(e){return s||'--'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ratingHtml(v,count,cls,stale){
  if(v===null||v===undefined) return '<span class="none">暂无评分</span>';
  return '<span class="rating '+cls+'">'+Number(v).toFixed(1)+'</span><span class="count">'+(count?count+' 条':'')+'</span>'+(stale?'<span class="stale">沿用上次</span>':'');
}
function renderMeta(){
  const m=DATA.metrics||{};const ok=(m.google_ok===m.google_total)&&(m.apple_ok===m.apple_total);
  document.getElementById('meta').innerHTML =
    '<span class="pill"><span class="dot'+(ok?'':' warn')+'"></span>最近更新 '+fmtTime(DATA.updated_at)+'</span>'+
    '<span class="pill">下次预计 '+fmtTime(DATA.next_update)+'</span>'+
    '<span class="pill">Google Play '+(m.google_ok||0)+'/'+(m.google_total||0)+'</span>'+
    '<span class="pill">App Store '+(m.apple_ok||0)+'/'+(m.apple_total||0)+'</span>';
  document.getElementById('xlsx').href=encodeURIComponent(DATA.xlsx_file);
}
function renderCards(){
  const products=DATA.products||[];const total=products.reduce((a,p)=>a+p.total,0);const changes=Object.values(DATA.changes||{}).flat().filter(x=>!x.includes('与上次一致')&&!x.includes('更新状态')).length;
  document.getElementById('cards').innerHTML =
    '<div class="card"><div class="label">监测产品</div><div class="value">'+products.length+' 款</div><div class="sub">Google Play + App Store</div></div>'+
    '<div class="card"><div class="label">监测地区</div><div class="value">'+total+'</div><div class="sub">含两个 RU 独立包</div></div>'+
    '<div class="card"><div class="label">当前有评分项</div><div class="value">'+products.reduce((a,p)=>a+p.rated_google+p.rated_ios,0)+'</div><div class="sub">谷歌评分 + iOS 评分</div></div>'+
    '<div class="card"><div class="label">变化说明条目</div><div class="value">'+changes+'</div><div class="sub">与上一次快照相比</div></div>';
}
function renderProducts(){
  document.getElementById('products').innerHTML=(DATA.products||[]).map(p=>`
    <section class="product">
      <div class="product-head"><div><h2>${esc(p.name)}</h2><div class="desc">公开地区评分与商店直达链接</div></div><div class="badges"><span class="badge">谷歌 ${p.rated_google}/${p.total} 有评分</span><span class="badge ios">iOS ${p.rated_ios}/${p.total} 有评分</span></div></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>国家/地区</th><th>谷歌评分</th><th>iOS 评分</th><th>商店链接</th></tr></thead><tbody>
      ${p.rows.map(r=>`<tr><td><span class="country">${esc(r.country)}</span><span class="cn">${esc(r.country_name)}</span></td><td>${ratingHtml(r.google_rating,r.google_count,'',r.google_stale)}</td><td>${ratingHtml(r.ios_rating,r.ios_count,'ios',r.ios_stale)}</td><td><div class="links"><a class="mini" target="_blank" rel="noopener" href="${esc(r.google_url)}">Google Play</a>${r.ios_unavailable?'<span class="unavailable">App Store 不可用</span>':`<a class="mini" target="_blank" rel="noopener" href="${esc(r.apple_url)}">App Store</a>`}</div></td></tr>`).join('')}
      </tbody></table></div>
      <div class="notes"><h3>本次数据变化</h3>${(p.changes||[]).map(x=>'<p>'+esc(x)+'</p>').join('')}</div>
    </section>`).join('');
}
function renderHistory(){
  document.getElementById('history').innerHTML=(DATA.history||[]).slice().reverse().map(h=>'<div class="hist"><b>'+fmtTime(h.at)+'</b><span>'+(h.changes||0)+' 项变化</span><br><span>G '+(h.google_ok||0)+'/'+(h.google_total||0)+' · A '+(h.apple_ok||0)+'/'+(h.apple_total||0)+'</span></div>').join('')||'<div class="hist"><b>暂无历史</b><span>下一次更新后显示</span></div>';
}
function renderErrors(){
  if(DATA.errors&&DATA.errors.length){const box=document.getElementById('errorbox');box.style.display='block';box.textContent='部分数据抓取失败，已在对应评分旁标记“沿用上次”：'+DATA.errors.slice(0,4).join('；');}
}
renderMeta();renderCards();renderProducts();renderHistory();renderErrors();
